services:
  proxy:
    image: nginx:1.27-alpine
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/up"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    env_file: .env
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - app_storage:/var/www/html/storage
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "php artisan about --only=environment --no-ansi > /dev/null"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    env_file: .env
    command: ["php", "artisan", "migrate", "--force", "--no-interaction"]
    depends_on:
      database:
        condition: service_healthy
    networks:
      - backend
    restart: "no"

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    env_file: .env
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - backend
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    env_file: .env
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - backend
    restart: unless-stopped

  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backup:
    image: mysql:8.4
    environment:
      DB_HOST: database
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    command: ["sh", "/usr/local/bin/backup.sh"]
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - ./docker/backup/backup.sh:/usr/local/bin/backup.sh:ro
      - ./storage/backups:/backups
    networks:
      - backend
    restart: unless-stopped

  frontend:
    image: node:22-alpine
    profiles: ["tools"]
    working_dir: /app
    command: ["sh", "-c", "npm ci && npm run build"]
    volumes:
      - ./:/app

networks:
  frontend:
  backend:
    internal: true

volumes:
  mysql_data:
  app_storage:
