server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;
    # Docker puede asignar una nueva IP a PHP-FPM durante un redeploy. Resolver
    # dinámicamente evita que Nginx conserve una IP anterior y responda 502.
    resolver 127.0.0.11 ipv6=off valid=10s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; img-src 'self' data:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        set $php_upstream app:9000;
        fastcgi_pass $php_upstream;
        fastcgi_read_timeout 60s;
    }

    location ~ /\. {
        deny all;
    }
}
